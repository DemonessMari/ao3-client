name: Verify clients
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev cmake ninja-build python3 libglib2.0-bin
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: QT_QPA_PLATFORM=offscreen build/ao3-client --smoke-test
      - run: ./scripts/package-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*.tar.gz
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./scripts/build-android.sh debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-development-build
          path: dist/*-debug.apk*
